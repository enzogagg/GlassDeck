name: Swift

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build daemon
        run: swift build
        working-directory: mac-daemon

      - name: Build Mac app
        run: swift build
        working-directory: mac-app
