<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>GlassDeck Surface</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <div id="screen-dimmer" class="screen-dimmer" aria-hidden="true"></div>

    <main class="desktop">
      <header class="menu-bar" aria-label="Barre système Surface">
        <section class="menu-left">
          <button class="brand-button" type="button" aria-label="GlassDeck">
            <span class="brand-mark">◆</span>
            <span>GlassDeck</span>
          </button>
          <span id="daemon-state" class="status-dot" aria-label="État du Mac"></span>
        </section>

        <section class="menu-right" aria-label="État rapide">
          <span id="mac-metrics" class="menu-chip menu-chip-metrics">CPU -- · RAM -- · Temp --</span>
          <span id="battery-status" class="menu-chip">🔋 --%</span>
          <button
            id="control-center-button"
            class="control-button"
            type="button"
            aria-label="Centre de contrôle"
            aria-expanded="false"
          >
            <span class="toggle-icon" aria-hidden="true"></span>
          </button>
          <time id="clock" class="clock">--:--</time>
        </section>
      </header>

      <section class="home-surface" aria-label="Accueil Surface"></section>

      <aside
        id="control-center"
        class="control-center"
        aria-label="Centre de contrôle"
        aria-hidden="true"
      >
        <div class="control-grid">
          <section class="control-card connection-card">
            <div>
              <span class="control-label">Mac</span>
              <strong id="daemon-label">Connexion</strong>
            </div>
            <button id="refresh-button" class="icon-button" type="button" aria-label="Actualiser">
              ↻
            </button>
          </section>

          <section class="control-card network-card">
            <div class="network-grid">
              <div>
                <span class="control-label">Mac</span>
                <strong id="ip-detail">--</strong>
                <small id="daemon-url">--</small>
              </div>
              <div>
                <span class="control-label">Surface</span>
                <strong id="surface-ip">127.0.0.1</strong>
                <small>IP Locale</small>
              </div>
            </div>
          </section>

          <section class="control-card status-card">
            <div>
              <span class="control-label">Installation</span>
              <strong id="install-status">--</strong>
            </div>
            <div>
              <span class="control-label">Bluetooth</span>
              <strong id="bluetooth-status">--</strong>
            </div>
            <div>
              <span class="control-label">Mac trouvé</span>
              <strong id="mac-found-status">--</strong>
            </div>
          </section>

          <section class="control-card bluetooth-card">
            <div class="slider-header">
              <div>
                <span class="control-label">Bluetooth</span>
                <strong id="bluetooth-label">Recherche</strong>
              </div>
              <div class="button-row">
                <button id="bluetooth-scan-button" class="icon-button" type="button" aria-label="Scanner Bluetooth">
                  ⌕
                </button>
                <button id="bluetooth-forget-button" class="icon-button danger-icon-button" type="button" aria-label="Oublier Bluetooth">
                  ×
                </button>
              </div>
            </div>
            <div id="bluetooth-devices" class="device-list"></div>
          </section>

          <section class="control-card">
            <span class="control-label">Batterie</span>
            <strong id="battery-detail">Batterie inconnue</strong>
            <small id="battery-extra">API batterie non détectée</small>
          </section>

          <section class="control-card telemetry-card">
            <div class="slider-header">
              <span class="control-label">Mac</span>
            </div>
            <div class="telemetry-grid">
              <div>
                <span>CPU</span>
                <strong id="cpu-detail">--%</strong>
              </div>
              <div>
                <span>RAM</span>
                <strong id="memory-detail">--</strong>
              </div>
              <div>
                <span>Température</span>
                <strong id="temperature-detail">--</strong>
              </div>
            </div>
          </section>

          <section class="control-card slider-card">
            <div class="slider-header">
              <span class="control-label">Luminosité</span>
              <strong id="brightness-value">100%</strong>
            </div>
            <input
              id="brightness-slider"
              type="range"
              min="1"
              max="100"
              value="100"
              aria-label="Luminosité"
            />
          </section>

          <section class="control-card slider-card">
            <div class="slider-header">
              <span class="control-label">Volume</span>
              <strong id="volume-value">70%</strong>
            </div>
            <input
              id="volume-slider"
              type="range"
              min="0"
              max="100"
              value="70"
              aria-label="Volume"
            />
          </section>

          <section class="control-card action-card">
            <button class="wide-button" type="button" data-action="ping">Ping Mac</button>
            <button id="quit-button" class="wide-button quit-button" type="button">Quitter</button>
          </section>
        </div>
      </aside>
    </main>

    <script src="./app.js?v=11" type="module"></script>
  </body>
</html>
