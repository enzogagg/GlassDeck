<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlassDeck Surface</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="screen-dimmer" class="screen-dimmer" aria-hidden="true"></div>

    <main class="desktop">
      <header class="menu-bar" aria-label="Barre système Surface">
        <section class="menu-left">
          <button class="brand-button" type="button" aria-label="GlassDeck">
            <span class="brand-mark">◆</span>
            <span>GlassDeck</span>
          </button>
          <span id="daemon-state" class="status-dot" aria-label="État du Mac"></span>
        </section>

        <section class="menu-right" aria-label="État rapide">
          <span id="machine-ip" class="menu-chip">IP --</span>
          <span id="battery-status" class="menu-chip">Batterie --</span>
          <button
            id="control-center-button"
            class="control-button"
            type="button"
            aria-label="Centre de contrôle"
            aria-expanded="false"
          >
            <span class="toggle-icon" aria-hidden="true"></span>
          </button>
          <time id="clock" class="clock">--:--</time>
        </section>
      </header>

      <section class="home-surface" aria-label="Accueil Surface"></section>

      <aside
        id="control-center"
        class="control-center"
        aria-label="Centre de contrôle"
        aria-hidden="true"
      >
        <div class="control-grid">
          <section class="control-card connection-card">
            <div>
              <span class="control-label">Mac</span>
              <strong id="daemon-label">Connexion</strong>
            </div>
            <button id="refresh-button" class="icon-button" type="button" aria-label="Actualiser">
              ↻
            </button>
          </section>

          <section class="control-card">
            <span class="control-label">Machine</span>
            <strong id="ip-detail">--</strong>
            <small id="daemon-url">--</small>
          </section>

          <section class="control-card">
            <span class="control-label">Surface</span>
            <strong id="battery-detail">Batterie inconnue</strong>
            <small id="battery-extra">API batterie non détectée</small>
          </section>

          <section class="control-card slider-card">
            <div class="slider-header">
              <span class="control-label">Luminosité</span>
              <strong id="brightness-value">100%</strong>
            </div>
            <input
              id="brightness-slider"
              type="range"
              min="35"
              max="100"
              value="100"
              aria-label="Luminosité"
            />
          </section>

          <section class="control-card slider-card">
            <div class="slider-header">
              <span class="control-label">Volume</span>
              <strong id="volume-value">70%</strong>
            </div>
            <input
              id="volume-slider"
              type="range"
              min="0"
              max="100"
              value="70"
              aria-label="Volume"
            />
          </section>

          <section class="control-card action-card">
            <button class="wide-button" type="button" data-action="ping">Ping Mac</button>
            <button class="wide-button" type="button" data-action="open-applications">
              Applications
            </button>
          </section>
        </div>
      </aside>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
